<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EgolePay SDK Loader</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111827;
    }

    main {
      max-width: 420px;
      margin: 48px auto;
      padding: 24px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    p {
      margin: 0 0 16px;
      color: #4b5563;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border: 0;
      border-radius: 10px;
      background: #ff7916;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #e66a00;
    }

    .status {
      margin-top: 16px;
      font-size: 14px;
      color: #065f46;
    }
  </style>
</head>
<body>
  <main>
    <h1>EgolePay SDK Test</h1>
    <p>This page loads the EgolePay SDK in isolation and triggers the minimum payment test.</p>

    <div class="field">
      <label for="amount">Amount</label>
      <input id="amount" type="number" min="1" />
    </div>

    <button id="proceed-to-payment" type="button">Proceed to payment</button>
    <div id="sdk-status" class="status">Checking SDK...</div>
  </main>

  <!-- <script src="https://pulsebridge.egolepay.com/pulsebridge-v0.0.js"></script> -->
  <script src="https://apigateway-test.egolepay.com/pulsebridge-standard.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const formData = {
      amount: params.get("amount") || "1000",
      reference: params.get("reference") || "TXN_SAMPLE_2500",
      email: params.get("email") || "customer@example.com",
      apiKey: params.get("apiKey") || "",
      customerName: params.get("customerName") || "testuser",
      phone: params.get("phone") || "",
      metadata: {
        source: "builders_liability_modal",
        user_id: "",
        merchant_id: ""
      }
    };
    let autoStartRequested = false;
    let autoStartTimer = null;
    let paymentStarted = false;

    const amountInput = document.getElementById("amount");
    const proceedButton = document.getElementById("proceed-to-payment");
    const sdkStatus = document.getElementById("sdk-status");

    amountInput.value = formData.amount;

    const resetPaymentState = () => {
      paymentStarted = false;
      proceedButton.disabled = false;
      proceedButton.textContent = "Proceed to payment";
    };

    const updateSdkStatus = () => {
      const sdkLoaded = typeof window.EgolePay === "function";
      const apiKeyLoaded = Boolean(formData.apiKey);

      if (!apiKeyLoaded) {
        sdkStatus.textContent = "EgolePay API key is missing.";
        sdkStatus.style.color = "#b91c1c";
        return;
      }

      sdkStatus.textContent = sdkLoaded
        ? "EgolePay SDK loaded successfully."
        : "EgolePay SDK is not available yet.";
      sdkStatus.style.color = sdkLoaded ? "#065f46" : "#b91c1c";
    };

    const hydratePaymentDetails = (nextConfig) => {
      resetPaymentState();
      formData.amount = String(nextConfig.amount || formData.amount || "1000");
      formData.reference = nextConfig.reference || formData.reference;
      formData.email = nextConfig.email || formData.email;
      formData.apiKey = nextConfig.apiKey || formData.apiKey;
      formData.customerName = nextConfig.customerName || formData.customerName;
      formData.phone = nextConfig.phone || formData.phone;
      formData.metadata = {
        ...formData.metadata,
        ...(nextConfig.metadata || {})
      };
      amountInput.value = formData.amount;
      updateSdkStatus();
    };

    const queueAutoStart = () => {
      if (!autoStartRequested) {
        return;
      }

      if (!formData.apiKey) {
        updateSdkStatus();
        return;
      }

      window.clearTimeout(autoStartTimer);
      autoStartTimer = window.setTimeout(() => {
        if (typeof window.EgolePay !== "function") {
          queueAutoStart();
          return;
        }

        startPayment();
      }, 250);
    };

    const startPayment = () => {
      if (paymentStarted) {
        return;
      }

      formData.amount = amountInput.value;

      if (!formData.apiKey) {
        updateSdkStatus();
        alert("EgolePay API key is missing.");
        return;
      }

      if (typeof window.EgolePay !== "function") {
        updateSdkStatus();
        alert("EgolePay SDK not loaded yet.");
        return;
      }

      paymentStarted = true;
      proceedButton.disabled = true;
      proceedButton.textContent = "Initializing payment...";
      sdkStatus.textContent = "Initializing EgolePay checkout...";
      sdkStatus.style.color = "#065f46";

      try {
        new window.EgolePay({
          apiKey: formData.apiKey,
          amount: Number(formData.amount),
          email: formData.email,
          reference: formData.reference,
          customerName: formData.customerName,
          phone: formData.phone,
          metadata: formData.metadata,
          onSuccess: (response) => {
            console.log("EgolePay success:", response);
            sdkStatus.textContent = "Payment completed successfully.";
            sdkStatus.style.color = "#065f46";
          },
          onCancel: (info) => {
            console.log("EgolePay cancelled:", info);
            resetPaymentState();
            sdkStatus.textContent = "Payment was cancelled.";
            sdkStatus.style.color = "#b45309";
          },
          onError: (error) => {
            console.error("EgolePay error:", error);
            resetPaymentState();
            sdkStatus.textContent = error?.message || "Payment failed.";
            sdkStatus.style.color = "#b91c1c";
          },
          onClose: (info) => {
            console.log("EgolePay closed:", info);
            resetPaymentState();
            sdkStatus.textContent = "Payment modal closed.";
            sdkStatus.style.color = "#4b5563";
          },
          onStepChange: (step) => {
            console.log("EgolePay step changed:", step);
          }
        });
      } catch (error) {
        console.error("EgolePay init error:", error);
        resetPaymentState();
        updateSdkStatus();
        alert("EgolePay failed to initialize.");
      }
    };

    window.startPayment = startPayment;

    window.addEventListener("message", (event) => {
      if (event.origin !== window.location.origin) {
        return;
      }

      const nextConfig = event.data && event.data.egolePayConfig;
      if (!nextConfig) {
        return;
      }

      autoStartRequested = Boolean(nextConfig.autoStart);
      hydratePaymentDetails(nextConfig);
      queueAutoStart();
    });

    proceedButton.addEventListener("click", startPayment);
    window.addEventListener("load", updateSdkStatus);
    updateSdkStatus();
  </script>
</body>
</html>
